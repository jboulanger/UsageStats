[project]
name = "usagestats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jboulanger", email = "jerome.boulanger@laposte.net" }
]
requires-python = ">=3.13"
dependencies = [
    "icalendar>=7.3.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pytz>=2026.5",
    "seaborn>=0.13.2",
    "xlrd>=2.0.2",
]

[project.scripts]
usagestats = "usagestats:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
